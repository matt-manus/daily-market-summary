name: Market Monitor (dev preview)

# Builds market-monitor.html on the dev-monitor branch:
# today's index.html from main + new Kelileo-style Sections 8-12.
# Does not touch main or index.html.
on:
  push:
    branches: [ dev-monitor ]
    paths:
      - 'scripts/market_monitor/**'
      - '.github/workflows/market_monitor_dev.yml'
  workflow_dispatch:

concurrency:
  group: market-monitor-dev
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Checkout dev-monitor
        uses: actions/checkout@v4
        with:
          ref: dev-monitor
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install "yfinance>=0.2.40" pandas numpy requests

      - name: Use today's index.html from main
        run: |
          git fetch --depth=1 origin main
          git checkout origin/main -- index.html

      - name: Run engine
        run: python scripts/market_monitor/engine.py

      - name: Render page
        run: python scripts/market_monitor/render.py

      - name: Commit outputs to dev-monitor
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add market-monitor.html data/monitor/
          git reset -q index.html || true
          git checkout -- index.html 2>/dev/null || true
          if git diff --staged --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Market monitor preview update [skip ci]"
          git push origin HEAD:dev-monitor
